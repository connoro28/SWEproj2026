services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stake
      POSTGRES_PASSWORD: stake_local_only
      POSTGRES_DB: stake
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - stake-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stake -d stake"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  stake-db:
